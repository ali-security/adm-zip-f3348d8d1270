name: Linux build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional mocha grep pattern. Empty runs the full suite."
        required: false
        default: ""

jobs:
  build:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        # mocha nolonger supports node 10
        node-version: [22.x, 12.x, 14.x, 16.x, 18.x, 20.x, 21.x]

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Pin registry to the release date
        run: |
          npm config set registry "https://:2024-08-30T07%3A40%3A50Z@time-machines-npm.sealsecurity.io/"

      - name: Install
        run: |
          npm install

      - name: Run Tests
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npm test -- --grep "${{ inputs.test-filter }}"
          else
            npm test
          fi

      - name: Pack tarball
        if: matrix.node-version == '22.x'
        run: |
          npm pack

      - name: Upload tarball
        if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: adm-zip-0.5.16.tgz
          if-no-files-found: error
